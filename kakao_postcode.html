<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주소검색</title>
    <!-- 카카오 우편번호 스크립트 로드 -->
    <script src="https://t1.daumcdn.net"></script>
</head>
<body>
    <div id="wrap" style="width:100%; height:100%; min-height:500px;"></div>

    <script>
        var element_wrap = document.getElementById('wrap');

        new daum.Postcode({
            oncomplete: function(data) {
                // 사용자가 주소를 선택했을 때 Access VBA가 읽을 수 있도록 document.title에 값을 주입
                // 형식: 우편번호 || 도로명주소(또는 지번주소)
                var fullAddr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                document.title = data.zonecode + "||" + fullAddr;
            },
            onclose: function(state) {
                // 창이 닫히거나 완료되었을 때 알림용 타이틀 변경
                if(document.title.indexOf("||") === -1) {
                    document.title = "CLOSED";
                }
            },
            width : '100%',
            height : '100%'
        }).embed(element_wrap);
    </script>
</body>
</html>
