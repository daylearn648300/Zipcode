<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        window.onload = function(){
            new daum.Postcode({
                oncomplete: function(data) {
                    var zonecode = data.zonecode; // 우편번호
                    var fullAddr = data.roadAddress; // 도로명 주소

                    // 만약 엑세스 VBA 혹은 폼과 연동하는 경우:
                    // 부모창이나 특정 프로토콜로 값을 전달하거나, 
                    // 로컬 서버 API로 전송 후 엑세스가 폴링(Polling)하는 방식을 사용할 수 있습니다.
                    
                    // 예시: 부모 윈도우가 존재할 경우 postMessage 전달
                    if (window.parent != window) {
                        window.parent.postMessage({
                            zonecode: zonecode,
                            address: fullAddr
                        }, '*');
                    }
                }
            }).embed(document.getElementById('postcodeWrap'));
        }
    </script>
</head>
<body style="margin:0;padding:0;">
    <div id="postcodeWrap" style="width:100%;height:100vh;"></div>
</body>
</html>
